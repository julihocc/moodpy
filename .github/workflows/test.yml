name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install wheel with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl pytest pytest-cov
      - name: Verify installed package
        run: |
          python -c "from pathlib import Path; from importlib.metadata import version; import moodpy; assert Path.cwd() / 'src' not in Path(moodpy.__file__).resolve().parents; assert moodpy.__version__ == version('moodpy') == '3.0.1'"
      - name: Run tests against the installed wheel
        env:
          MOODPY_TEST_INSTALLED: "1"
        run: python -m pytest -q
      - name: Bank smoke check
        run: |
          python examples/agent_workflow/author_bank.py --seed 42 --samples 2 --output artifacts/ci-bank
          python -c "from xml.etree import ElementTree as ET; from pathlib import Path; import json; root = ET.parse('artifacts/ci-bank/bank.xml'); assert len(root.findall('question[@type=\"cloze\"]')) == 8; data = json.loads(Path('artifacts/ci-bank/manifest.json').read_text()); assert data['validation']['valid']"
